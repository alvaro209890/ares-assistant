# Configuração do empacotador. NÃO é executada nesta etapa.
# Quando você quiser gerar o instalador (somente no futuro), rode:  npm run dist:deb
# O ÚNICO alvo configurado é .deb (Linux), como combinado.
appId: com.ares.assistant
productName: ARES
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
linux:
  target:
    - deb
  category: Utility
  maintainer: acer
  synopsis: Assistente de IA pessoal estilo JARVIS
  description: >-
    ARES — assistente de IA pessoal com voz (STT/TTS), cérebro via 9 Router
    (GPT 5.5) e módulo de tarefas estilo Trello. Uso local, sem login.
